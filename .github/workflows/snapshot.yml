name: Daily API schema snapshot

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC every day
  workflow_dispatch:       # allow manual runs from the Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run snapshot
        run: node scripts/snapshot.js

      - name: Commit data changes
        run: |
          git config user.name "api-time-machine"
          git config user.email "api-time-machine@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
